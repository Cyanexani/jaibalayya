<div class="xpanel" data-x-ui>
  <p class="eyebrow">Experiments</p>
  <div class="xpanel__list" role="group" aria-label="Experimental interactions">
    <button class="xswitch" type="button" role="switch" aria-checked="true" data-x-toggle="tilt">
      <span class="xswitch__box" aria-hidden="true"></span>
      <span class="xswitch__text"><b>Press tilt</b><em>Tiles and buttons tip toward the press, the way the phone answered a thumb.</em></span>
    </button>
    <button class="xswitch" type="button" role="switch" aria-checked="true" data-x-toggle="jump">
      <span class="xswitch__box" aria-hidden="true"></span>
      <span class="xswitch__text"><b>Quick jump</b><em>Ctrl&nbsp;+&nbsp;K, or <kbd>/</kbd>, to reach any page or section by name.</em></span>
    </button>
    <button class="xswitch" type="button" role="switch" aria-checked="true" data-x-toggle="turnstile">
      <span class="xswitch__box" aria-hidden="true"></span>
      <span class="xswitch__text"><b>Turnstile</b><em>Pages pivot in on their left edge instead of sliding across.</em></span>
    </button>
    <button class="xswitch" type="button" role="switch" aria-checked="false" data-x-toggle="lock">
      <span class="xswitch__box" aria-hidden="true"></span>
      <span class="xswitch__text"><b>Idle lock screen</b><em>Leave the page alone for a while and it locks itself. Any key wakes it.</em></span>
    </button>
  </div>
  <p class="xpanel__note">
    Remembered in this browser only. With all four off &mdash; or with JavaScript disabled &mdash;
    the site behaves exactly as it ships.
  </p>
</div>
