<!DOCTYPE html>
<html lang="en" class="no-js" data-page="{{page}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="theme-color" content="#06080f">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="assets/brand/mark.svg" color="#1f7bff">
<link rel="manifest" href="site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Metro OS">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="assets/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/metroui.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/experiments.css">
<script>
  /* accent, js flag and experiment flags applied before first paint to avoid a
     flash — the turnstile transition is read by the arriving document, so it
     has to be on <html> before anything renders. */
  (function () {
    var h = document.documentElement;
    h.classList.remove('no-js');
    try { h.setAttribute('data-accent', localStorage.getItem('metro-accent') || 'blue'); }
    catch (e) { h.setAttribute('data-accent', 'blue'); }
    var on = { tilt: 1, jump: 1, turnstile: 1, lock: 0 }, saved = {};
    try { saved = JSON.parse(localStorage.getItem('metro-x') || '{}') || {}; } catch (e) {}
    for (var k in on) {
      if ((k in saved) ? saved[k] : on[k]) h.setAttribute('data-x-' + k, '');
    }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{> sprite}}
<div class="scrollbar-top" aria-hidden="true"></div>
{{> nav}}
<main id="main">
{{content}}
</main>
{{> footer}}
<script src="assets/js/config.js"></script>
<script src="assets/js/metro.js" defer></script>
<script src="assets/js/simulator.js" defer></script>
<script src="assets/js/experiments.js" defer></script>
</body>
</html>
