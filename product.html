<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Store</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      try {
        const t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">Store</a>
    <ul class="nav-right">
      <li><a href="index.html">Shop</a></li>
      <li><a href="cart.html">Bag <span class="cart-badge" id="cart-count"></span></a></li>
      <li><button class="theme-toggle" id="theme-toggle" title="Toggle theme">☾</button></li>
    </ul>
  </nav>

  <div class="back-bar">
    <a class="back-link" href="index.html">← Back to shop</a>
  </div>

  <div id="page-content">
    <div class="skeleton-wrap">
      <div class="skel"></div>
      <div class="skel-lines">
        <div class="skel-line" style="width:30%;height:8px"></div>
        <div class="skel-line" style="width:80%;height:24px;margin-bottom:20px"></div>
        <div class="skel-line" style="width:60%;height:24px;margin-bottom:32px"></div>
        <div class="skel-line" style="width:40%;height:36px;margin-bottom:40px"></div>
        <div class="skel-line"></div>
        <div class="skel-line" style="width:90%"></div>
        <div class="skel-line" style="width:70%"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Added to bag</div>

  <script src="script.js"></script>
</body>
</html>
