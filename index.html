<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Prevent flash of wrong theme
    (function() {
      try {
        const t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">Store</a>
    <ul class="nav-right">
      <li><a href="index.html">Shop</a></li>
      <li><a href="cart.html">Bag <span class="cart-badge" id="cart-count"></span></a></li>
      <li><button class="theme-toggle" id="theme-toggle" title="Toggle theme">☾</button></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">New arrivals · 2025</p>
      <h1>Designed<br>to <em>last.</em></h1>
      <p class="hero-sub">A curated collection of products built with intention. No noise, no clutter — just what matters.</p>
      <a href="#products" class="btn">Shop the collection &nbsp;↓</a>
    </div>
  </section>

  <section class="products-section" id="products">
    <p class="section-label">All products</p>
    <h2 class="section-heading">The full range</h2>
    <div class="loading-grid" id="loading-grid">
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:60%"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:60%"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:60%"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:60%"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:60%"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:60%"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:60%"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line" style="width:60%"></div></div>
    </div>
    <div class="products-grid" id="products-grid" style="display:none"></div>
  </section>

  <footer>
    <p>© 2025 Store. All rights reserved.</p>
    <p>Built with FakeStore API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
