# Deploys Metro OS to GitHub Pages.
#
# Requires Pages to be enabled once, by hand:
#   Repository → Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Metro OS is plain static files with no build step. This workflow checks that
# every app has a notes file and every local file the page references exists,
# then publishes.

name: Deploy Metro OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check notes and files
        run: node tools/check.mjs

      - name: Assemble the publish directory
        run: |
          mkdir -p _site
          cp -r assets content _site/
          cp index.html 404.html site.webmanifest robots.txt .nojekyll _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
