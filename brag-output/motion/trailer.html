<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Metro OS trailer renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script src="bass.js"></script>
<script>
/* Metro OS trailer: every frame drawn by hand on a 2D canvas.
   renderFrame(i) averages SAMPLES sub-frames across a 180-degree shutter for real motion blur. */
const W = 1920, H = 1080, FPS = 30, DUR = 43.55, SHUTTER = 0.5;
/* more sub-frames where the camera moves fast, so blur reads as a smear, not copies */
const FAST = [[7.15, 7.5], [8.6, 9.5], [12.1, 12.5], [14.17, 14.95], [15.9, 16.3], [17.6, 17.8], [24.1, 25.3], [28.0, 28.6], [31.2, 31.85], [35.0, 35.6], [36.55, 37.0], [38.1, 38.6]];
const samplesAt = t => FAST.some(([a, b]) => t >= a && t <= b) ? 20 : 8;
const out = document.getElementById('out'), octx = out.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d');
const ACC = '#1ba1e2', GREY = '#a1a1a6', INK = '#f5f5f7';

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: t => t, inQ: t => t * t, outQ: t => 1 - (1 - t) * (1 - t), inC: t => t * t * t,
  outC: t => 1 - Math.pow(1 - t, 3), ioC: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outE: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t), inE: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  ioE: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  ioS: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outB: t => { const s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
};
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) { const [a, va] = keys[i - 1], [b, vb, e] = keys[i]; return lerp(va, vb, (e || E.ioC)(p(t, a, b))); }
  }
  return keys[keys.length - 1][1];
}
function bass(t) { const B = window.BASS || []; return B[clamp(Math.floor(t * FPS), 0, B.length - 1)] || 0; }
function rng(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- drawing primitives ---------- */
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function gradFill(c, x0, y0, x1, y1) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#4fdcf2'); g.addColorStop(0.46, '#2a86ff'); g.addColorStop(1, '#7a4dff'); return g;
}
function font(c, size, weight = 400, track = 0) { c.font = `${weight} ${size}px "Noto Sans"`; c.letterSpacing = (track * size) + 'px'; }
function tl(c, s, x, y, size, weight = 400, color = '#fff', align = 'left') {
  font(c, size, weight); c.fillStyle = color; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(s, x, y);
}
/* rich line: parts = string | [[text, gradient?, color?], ...] */
function rich(c, parts, x, y, o = {}) {
  if (typeof parts === 'string') parts = [[parts]];
  const size = o.size || 96, weight = o.weight || 600;
  c.save();
  font(c, size, weight, o.track ?? -0.035);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  const ws = parts.map(q => c.measureText(q[0]).width), tot = ws.reduce((a, b) => a + b, 0);
  let sx = o.align === 'left' ? x : o.align === 'right' ? x - tot : x - tot / 2;
  c.globalAlpha *= (o.alpha ?? 1);
  if ((o.blur || 0) > 0.3) c.filter = `blur(${o.blur.toFixed(2)}px)`;
  parts.forEach((q, i) => {
    c.fillStyle = q[1] ? gradFill(c, sx, y - size * 0.8, sx + ws[i], y) : (q[2] || o.color || INK);
    c.fillText(q[0], sx, y); sx += ws[i];
  });
  c.restore(); return tot;
}
function icon(c, code, x, y, size, color = '#fff', brand = false) {
  c.fillStyle = color; c.font = `${brand ? 400 : 900} ${size}px "${brand ? 'FAB' : 'FA'}"`; c.letterSpacing = '0px';
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String.fromCharCode(code), x, y); c.textBaseline = 'alphabetic';
}
function radial(c, x, y, r, rgba) {
  const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba); g.addColorStop(1, rgba.replace(/[\d.]+\)$/, '0)'));
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}

/* ---------- keynote-style type reveals ---------- */
function head(c, t, parts, x, y, o, tin, tout) {
  if (t < tin - 0.01 || t > tout + 0.4) return;
  const e = E.outC(p(t, tin, tin + (o.d || 0.7))), x2 = E.inQ(p(t, tout, tout + 0.3));
  rich(c, parts, x, y + (1 - e) * 34 - 14 * x2, { ...o, alpha: (o.alpha ?? 1) * e * (1 - x2), blur: (1 - e) * 9 });
}

/* ---------- original generative artwork for the Photos live tile ---------- */
function art(c, kind, w, h) {
  c.save(); c.beginPath(); c.rect(0, 0, w, h); c.clip();
  if (kind === 0) { // dawn: warm sky, sun, layered hills
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#2b1055'); g.addColorStop(0.45, '#d4418e'); g.addColorStop(0.8, '#ffb36b'); g.addColorStop(1, '#ffd8a8');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = 'rgba(255,236,190,0.95)'; c.beginPath(); c.arc(w * 0.62, h * 0.62, h * 0.18, 0, Math.PI * 2); c.fill();
    const hills = [['#6b2a6e', 0.7, 0.08], ['#4a1c55', 0.78, 0.1], ['#2a0f3a', 0.88, 0.07]];
    hills.forEach(([col, base, amp], k) => {
      c.fillStyle = col; c.beginPath(); c.moveTo(0, h);
      for (let x = 0; x <= w; x += w / 40) c.lineTo(x, h * base - Math.sin(x / w * (5 + k * 2) + k) * h * amp - Math.sin(x / w * 13 + k * 3) * h * amp * 0.3);
      c.lineTo(w, h); c.closePath(); c.fill();
    });
  } else if (kind === 1) { // ocean: deep blue, horizon, light path
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0b1e4a'); g.addColorStop(0.5, '#1b6fae'); g.addColorStop(0.52, '#0e3d6e'); g.addColorStop(1, '#061a33');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    radial(c, w * 0.3, h * 0.46, h * 0.5, 'rgba(160,220,255,0.55)');
    c.strokeStyle = 'rgba(190,230,255,0.35)'; c.lineWidth = Math.max(1, h * 0.006);
    for (let i = 0; i < 14; i++) { const y = h * (0.56 + i * 0.03); c.beginPath(); for (let x = 0; x <= w; x += w / 60) c.lineTo(x, y + Math.sin(x / w * 18 + i) * h * 0.006); c.stroke(); }
  } else { // night: violet sky, stars, crescent
    const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#060818'); g.addColorStop(0.6, '#2a1b6e'); g.addColorStop(1, '#7a4dff');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) { c.fillStyle = `rgba(255,255,255,${0.35 + rng(i) * 0.6})`; const r = (0.4 + rng(i + 9) * 1.2) * h / 240; c.beginPath(); c.arc(rng(i + 3) * w, rng(i + 7) * h * 0.8, r, 0, 7); c.fill(); }
    c.fillStyle = '#f2f6ff'; c.beginPath(); c.arc(w * 0.75, h * 0.3, h * 0.13, 0, 7); c.fill();
    c.fillStyle = '#1d1552'; c.beginPath(); c.arc(w * 0.75 + h * 0.06, h * 0.28, h * 0.12, 0, 7); c.fill();
  }
  c.restore();
}

/* ---------- the four-diamond mark ---------- */
const DIA = [[[50, 3], [73, 26], [50, 49], [27, 26], [50, 26]], [[26, 27], [49, 50], [26, 73], [3, 50], [26, 50]],
             [[74, 27], [97, 50], [74, 73], [51, 50], [74, 50]], [[50, 51], [73, 74], [50, 97], [27, 74], [50, 74]]];
function mark(c, cx, cy, size, parts, color) {
  const k = size / 100;
  c.save(); c.translate(cx - size / 2, cy - size / 2); c.scale(k, k);
  const g = color || gradFill(c, 0, 0, 100, 100);
  DIA.forEach((d, i) => {
    const P = parts[i] || { a: 1 }; if (P.a <= 0.001) return;
    c.save(); c.globalAlpha *= P.a * (i === 1 || i === 2 ? 0.9 : 1);
    const [ox, oy] = d[4];
    c.translate(ox + (P.dx || 0) / k, oy + (P.dy || 0) / k); c.rotate(P.rot || 0); c.scale(P.s ?? 1, P.s ?? 1); c.translate(-ox, -oy);
    c.beginPath(); c.moveTo(d[0][0], d[0][1]); for (let j = 1; j < 4; j++) c.lineTo(d[j][0], d[j][1]); c.closePath();
    c.fillStyle = g; c.fill(); c.restore();
  });
  c.restore();
}

/* ---------- the phone ---------- */
function phone(c, st, screen) {
  const yaw = st.yaw || 0, cs = Math.max(0.03, Math.cos(yaw)), sn = Math.sin(yaw), s = st.s;
  c.save(); c.globalAlpha *= (st.alpha ?? 1);
  c.translate(st.x, st.y); c.rotate(st.rot || 0); c.scale(s * cs, s);
  if (Math.abs(sn) > 0.01) { // visible side of the frame when turned
    const dx = sn * 26 / cs;
    const sg = c.createLinearGradient(-210 + dx, 0, 210 + dx, 0); sg.addColorStop(0, '#1b1d22'); sg.addColorStop(0.5, '#4a4e57'); sg.addColorStop(1, '#1b1d22');
    c.fillStyle = sg; rr(c, -210 + dx, -445, 420, 890, 56); c.fill();
  }
  c.save(); c.shadowColor = 'rgba(0,0,0,0.8)'; c.shadowBlur = 90 * s; c.shadowOffsetY = 50 * s;
  c.fillStyle = '#050506'; rr(c, -210, -445, 420, 890, 56); c.fill(); c.restore();
  if (st.glow) { c.save(); c.shadowColor = `rgba(42,134,255,${0.4 * st.glow})`; c.shadowBlur = 170 * s; c.fillStyle = '#050506'; rr(c, -210, -445, 420, 890, 56); c.fill(); c.restore(); }
  const rim = c.createLinearGradient(-210, -445, 210, 445);
  rim.addColorStop(0, '#9aa0aa'); rim.addColorStop(0.28, '#3a3d44'); rim.addColorStop(0.55, '#7a7f89'); rim.addColorStop(1, '#25272c');
  c.strokeStyle = rim; c.lineWidth = 4; rr(c, -210, -445, 420, 890, 56); c.stroke();
  c.fillStyle = '#6a6e78'; c.fillRect(211, -195, 4, 78); c.fillRect(211, -75, 4, 120);
  c.save(); rr(c, -196, -431, 392, 862, 44); c.clip(); c.translate(-196, -431);
  c.fillStyle = '#000'; c.fillRect(0, 0, 392, 862);
  if (screen) screen(c);
  if (st.sheen != null && st.sheen > 0 && st.sheen < 1) {
    const sx = -420 + st.sheen * 1250;
    const g = c.createLinearGradient(sx, 0, sx + 320, 140);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.13)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, 392, 862);
  }
  c.restore();
  c.fillStyle = '#07080b'; c.beginPath(); c.arc(0, -413, 8, 0, 7); c.fill();
  c.strokeStyle = '#15171c'; c.lineWidth = 2; c.stroke();
  if (st.light != null && st.light < 1) { c.fillStyle = `rgba(0,0,0,${1 - st.light})`; rr(c, -222, -457, 444, 914, 62); c.fill(); }
  c.restore();
}
function toWorld(st, lx, ly) { // phone-local (screen coords) -> world
  const cs = Math.cos(st.yaw || 0);
  return [st.x + (lx - 196) * st.s * cs, st.y + (ly - 431) * st.s];
}

/* ---------- phone UI ---------- */
function sbar(c, time, chip) {
  c.save(); c.fillStyle = '#e8e8e8'; c.strokeStyle = '#e8e8e8';
  for (let i = 0; i < 4; i++) c.fillRect(22 + i * 4.2, 18 - (i + 1) * 2.6, 3, (i + 1) * 2.6);
  c.lineWidth = 1.6; for (let i = 1; i <= 3; i++) { c.beginPath(); c.arc(50, 18, i * 3.3, -Math.PI * 0.76, -Math.PI * 0.24); c.stroke(); }
  c.beginPath(); c.arc(50, 17.5, 1.3, 0, 7); c.fill();
  tl(c, time, 370, 19, 12, 400, '#e8e8e8', 'right');
  font(c, 12); const bx = 370 - c.measureText(time).width - 30;
  c.lineWidth = 1.2; c.strokeRect(bx, 9.5, 18, 9); c.fillRect(bx + 2, 11.5, 14, 5); c.fillRect(bx + 18.6, 12, 1.8, 4);
  if (chip) { c.globalAlpha *= chip; c.fillStyle = '#2e7d32'; rr(c, 70, 5, 54, 18, 9); c.fill(); icon(c, 0xf095, 82, 14, 9); tl(c, '0:01', 91, 18, 11, 400, '#fff'); }
  c.restore();
}
const CELL = 57.6, GAP = 6, PAD = 8, TOP = 34;
const span = n => n * CELL + (n - 1) * GAP;
const G = { phone: 0xf095, msg: 0xf27a, mail: 0xf0e0, globe: 0xf0ac, weather: 0xf6c4, music: 0xf025, camera: 0xf030, store: 0xf54e,
  notes: 0xf249, calc: 0xf1ec, maps: 0xf5a0, radio: 0xf8d7, books: 0xf518, video: 0xf008, mic: 0xf130, gear: 0xf013, folder: 0xf07b,
  play: 0xf04b, next: 0xf051, disc: 0xf51f, shuffle: 0xf074, hang: 0xf3dd, search: 0xf002, grid: 0xf009, fb: 0xf4ad, people: 0xf500,
  image: 0xf03e, podcast: 0xf2ce, clock: 0xf017, cal: 0xf073, doc: 0xf15c, wallet: 0xf555, spotify: 0xf1bc, yt: 0xf167 };
const START = [
  { id: 'hub', c: 0, r: 0, w: 4, h: 2, k: 'hub' }, { id: 'clock', c: 4, r: 0, w: 2, h: 2, k: 'clock' },
  { id: 'phone', c: 0, r: 2, i: G.phone }, { id: 'msg', c: 1, r: 2, i: G.msg, k: 'msg' },
  { id: 'mail', c: 0, r: 3, i: G.mail }, { id: 'browser', c: 1, r: 3, i: G.globe },
  { id: 'weather', c: 2, r: 2, w: 2, h: 2, i: G.weather, l: 'Weather' }, { id: 'cal', c: 4, r: 2, w: 2, h: 2, k: 'cal' },
  { id: 'music', c: 0, r: 4, w: 2, h: 2, i: G.music, l: 'Music' }, { id: 'photos', c: 2, r: 4, w: 4, h: 2, k: 'photos' },
  { id: 'people', c: 0, r: 6, w: 2, h: 2, k: 'people' }, { id: 'camera', c: 2, r: 6, i: G.camera }, { id: 'store', c: 3, r: 6, i: G.store },
  { id: 'notes', c: 2, r: 7, i: G.notes }, { id: 'calc', c: 3, r: 7, i: G.calc }, { id: 'maps', c: 4, r: 6, w: 2, h: 2, i: G.maps, l: 'Maps' },
  { id: 'radio', c: 0, r: 8, i: G.radio }, { id: 'books', c: 1, r: 8, i: G.books }, { id: 'video', c: 2, r: 8, i: G.video },
  { id: 'rec', c: 3, r: 8, i: G.mic }, { id: 'settings', c: 4, r: 8, i: G.gear }, { id: 'files', c: 5, r: 8, i: G.folder }];
const TILE = {}; START.forEach(t => { t.x = PAD + t.c * (CELL + GAP); t.y = TOP + t.r * (CELL + GAP); t.W = span(t.w || 1); t.H = span(t.h || 1); TILE[t.id] = t; });
const PEOPLE = [['HN', '#0f7a74'], ['AM', '#1a68e0'], ['DR', '#d0288a'], ['AI', '#6b3fd1'], ['KS', '#a05e05'], ['SK', '#8a2be2']];

function tileFace(c, t, w, h, o = {}) {
  const f = o.flip || 0, back = f > 0.5;
  if (f > 0) { c.translate(0, h / 2); c.scale(1, Math.max(0.002, Math.abs(Math.cos(Math.PI * f)))); c.translate(0, -h / 2); }
  c.fillStyle = o.color || ACC; c.fillRect(0, 0, w, h);
  const label = s => tl(c, s, 7, h - 6, 11, 400, '#fff');
  switch (t.k) {
    case 'hub':
      if (!back) { tl(c, 'Welcome to Metro OS.', 9, 24, 14, 600); tl(c, 'Hold any tile for its shortcuts;', 9, 43, 12); tl(c, 'hold and drag to move it.', 9, 59, 12); }
      else { tl(c, 'Metro OS 0.5', 9, 24, 14, 600); tl(c, 'smoother, smarter', 9, 43, 12); tl(c, 'notifications', 9, 59, 12); }
      label('Metro OS'); break;
    case 'clock': tl(c, '5:45', 8, 48, 44, 300); label('PM'); break;
    case 'cal': tl(c, '27', 8, 48, 44, 300); label('Sunday'); break;
    case 'photos': art(c, back ? (o.artB ?? 1) : (o.artA ?? 0), w, h); label('Photos'); break;
    case 'people': PEOPLE.forEach((q, i) => { const cw = w / 3, ch = h / 2, x = (i % 3) * cw, y = Math.floor(i / 3) * ch; c.fillStyle = q[1]; c.fillRect(x, y, cw + 0.5, ch + 0.5); tl(c, q[0], x + cw / 2, y + ch / 2 + 8, 21, 400, '#fff', 'center'); }); break;
    default:
      icon(c, t.i, w / 2, h / 2, (t.w || 1) > 1 ? 38 : 24);
      if (t.l) label(t.l);
      if (t.k === 'msg' && o.count > 0.01) { tl(c, String(Math.max(1, Math.round(o.count))), w - 6, 16, 12, 600, '#fff', 'right'); }
  }
}
function drawTile(c, t, prog, o = {}) {
  if (prog <= 0) return;
  const e = E.outC(prog), sx = Math.cos((1 - e) * Math.PI / 2);
  c.save(); c.globalAlpha *= Math.min(1, e * 1.3);
  c.translate(t.x, t.y);
  if (o.scale && o.scale !== 1) { c.translate(t.W / 2, t.H / 2); c.scale(o.scale, o.scale); c.translate(-t.W / 2, -t.H / 2); }
  if (o.shadow) { c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 18; c.shadowOffsetY = 8; c.fillStyle = ACC; c.fillRect(0, 0, t.W, t.H); c.shadowColor = 'transparent'; }
  c.scale(Math.max(0.002, sx), 1);

  tileFace(c, t, t.W, t.H, o);

}
function drawStart(c, st) {
  // st: prog(tile)->0..1, blur 0..1, held, heldScale, sats[], banner, count, photosFlip, hubFlip, touch, chrome
  sbar(c, st.time || '5:45', st.chip);
  const b = st.blur || 0;
  START.forEach(t => {
    if (st.held && t.id === st.held) return;
    const o = { count: t.id === 'msg' ? st.count : 0, scale: t.id === 'msg' ? (st.msgScale || 1) : 1 };
    if (t.id === 'photos') { o.flip = st.photosFlip || 0; o.artA = 0; o.artB = 1; }
    if (t.id === 'hub') o.flip = st.hubFlip || 0;
    if (b > 0.01) o.filter = `blur(${(b * 4.5).toFixed(2)}px) brightness(${(1 - b * 0.5).toFixed(3)})`;
    drawTile(c, t, st.prog(t), o);
  });
  c.save(); c.globalAlpha *= (st.chrome ?? 1);
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(28, 644, 16, 0, 7); c.stroke();
  tl(c, 'All apps', 56, 649, 15, 400, '#fff');
  mark(c, 196, 834, 22, [], '#fff');
  c.restore();
  if (st.held) drawTile(c, TILE[st.held], st.prog(TILE[st.held]), { scale: st.heldScale || 1, shadow: (st.heldScale || 1) > 1.01 });
  if (st.sats) {
    const m = TILE.music, mx = m.x + m.W / 2, my = m.y + m.H / 2;
    [[G.play, 'play', 2, 4], [G.next, 'next', 2, 5], [G.disc, 'now playing', 0, 3], [G.shuffle, 'shuffle', 1, 3]].forEach((q, i) => {
      const v = st.sats[i] || 0; if (v <= 0.001) return;
      const e = E.outB(clamp(v)), tx = PAD + q[2] * (CELL + GAP), ty = TOP + q[3] * (CELL + GAP);
      const x = lerp(mx - CELL / 2, tx, e), y = lerp(my - CELL / 2, ty, e), sc = lerp(0.25, 1, e);
      c.save(); c.globalAlpha *= clamp(v * 2.5); c.translate(x + CELL / 2, y + CELL / 2); c.scale(sc, sc);
      c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 20; c.shadowOffsetY = 8; c.fillStyle = ACC; c.fillRect(-CELL / 2, -CELL / 2, CELL, CELL);
      c.shadowColor = 'transparent'; icon(c, q[0], 0, -5, 18); tl(c, q[1], 0, CELL / 2 - 5, 8.5, 400, '#fff', 'center'); c.restore();
    });
    if (st.hint) { c.save(); c.globalAlpha *= st.hint; tl(c, 'tap a shortcut · drag the tile to move it · tap outside to close', 196, 780, 10.5, 400, '#ddd', 'center'); c.restore(); }
  }
  if (st.banner > 0.001) banner(c, st.banner, G.msg, 'Ava', 'see you at 7?', st.bannerBar);
  if (st.touch) touch(c, st.touch);
}
function banner(c, v, ic, title, body, bar) {
