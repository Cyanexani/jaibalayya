<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metro OS</title>
  <meta name="robots" content="noindex">
  <script>
    // Metro OS links look like /#/info/music. A path like /info/music (typed or
    // shared without the #) lands here; send it to the same screen inside the OS.
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var base = '/';
      if (/\.github\.io$/.test(location.hostname) && parts.length) base = '/' + parts.shift() + '/';
      if (parts[parts.length - 1] === '404.html') parts.pop();
      location.replace(base + (parts.length ? '#/' + parts.join('/') : ''));
    })();
  </script>
</head>
<body style="background:#000;color:#fff;font:16px system-ui,sans-serif;padding:24px">
  <p>Opening Metro OS… <a href="./" style="color:#1ba1e2">Continue</a></p>
</body>
</html>
